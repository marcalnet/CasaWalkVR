# Automatic checks (code audit, stage A2): every push and pull request runs
# the Node tests, as on a fresh clone (no install: the app's dependencies are
# vendored, and npm test needs none of the dev tools). It also warns when the
# pushed commit was not stamped (npm run stamp writes js/version.js with the
# commit count it will have once committed). The actions are pinned to the
# commit of a release (a moved tag can't change what runs here).

name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # (the whole history: the build number is the commit count)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Node tests
        run: npm test
      - name: Build stamp
        if: github.event_name == 'push' # (a pull request's merge commit never matches the stamp)
        run: |
          count=$(git rev-list --count HEAD)
          build=$(grep -o 'number: [0-9][0-9]*' js/version.js | grep -o '[0-9][0-9]*')
          if [ "$build" != "$count" ]; then
            echo "::warning file=js/version.js::js/version.js says build $build, but this commit is number $count: run npm run stamp before committing what you push."
          else
            echo "Build $build is stamped."
          fi
